<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourdough Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,500&display=swap');

:root{
  --color-background-primary:#fffdfa;
  --color-background-secondary:#f4efe7;
  --color-border-tertiary:#eae4d9;
  --color-border-secondary:#ddd5c7;
  --color-text-primary:#231f1b;
  --color-text-secondary:#73695e;
  --border-radius-lg:18px;
  --border-radius-md:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-background-primary:#211e1a;
    --color-background-secondary:#16140f;
    --color-border-tertiary:#332d24;
    --color-border-secondary:#42392c;
    --color-text-primary:#f3efe7;
    --color-text-secondary:#a89c8c;
  }
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--color-background-secondary);min-height:100dvh}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--color-text-primary)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}

.pg{
  --accent:#c1791f;
  --accent-soft:rgba(193,121,31,.13);
  --accent-soft-strong:rgba(193,121,31,.22);
  --slab:'Zilla Slab',Georgia,serif;
}
.pg :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* hero */
.hero{display:flex;align-items:center;gap:11px;margin-bottom:1rem;padding:0 .15rem}
.hero-mark{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-mark i{font-size:19px;color:var(--accent)}
.hero-title{font-family:var(--slab);font-weight:700;font-size:21px;color:var(--color-text-primary);line-height:1.15}
.hero-sub{font-size:12.5px;color:var(--color-text-secondary);margin-top:1px}

/* tabs */
.tab-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 1px;margin-bottom:.75rem;scrollbar-width:none;position:relative}
.tab-scroll::-webkit-scrollbar{display:none}
.tab-scroll::after{content:'';position:sticky;right:0;top:0;display:block;width:48px;height:100%;flex-shrink:0;background:linear-gradient(to right,transparent,var(--color-background-secondary) 80%);pointer-events:none;margin-left:-48px;float:right}
.tab-track{display:flex;gap:8px;width:max-content;padding-right:48px}
.tab-btn{white-space:nowrap;padding:9px 15px;border-radius:999px;border:1.5px solid var(--color-border-secondary);font-size:14px;font-weight:500;background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;transition:background .15s,color .15s,border-color .15s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-btn:active{opacity:.8}

/* equipment */
.equip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.equip-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--color-text-primary);background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.6rem .7rem;line-height:1.3}
.equip-item::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.equip-opt{margin-left:auto;font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;padding-left:6px}

/* cards */
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem;margin-bottom:.75rem}
.sec-label{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem}
.sec-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.sec-row .sec-label{margin-bottom:0}

/* controls */
.control-group{margin-bottom:14px}
.control-group:last-child{margin-bottom:0}
.control-label{font-size:13px;color:var(--color-text-secondary);margin-bottom:6px;display:block}
.seg-row{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}
.seg-btn{padding:11px 0;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:14px;font-weight:500;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;-webkit-appearance:none;appearance:none;touch-action:manipulation;width:100%;transition:background .15s,border-color .15s,color .15s}
.seg-btn i{font-size:15px;pointer-events:none}
.seg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg-btn:active{opacity:.85}

/* ingredients */
.mult-badge{font-family:var(--slab);font-weight:600;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.ingr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ingr-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.7rem .8rem;border-left:2.5px solid var(--accent)}
.ingr-amt{font-family:var(--slab);font-size:21px;font-weight:600;color:var(--color-text-primary);font-variant-numeric:tabular-nums}
.ingr-lbl{font-size:12px;color:var(--color-text-secondary);margin-top:1px}

/* progress */
.prog-wrap{margin-bottom:.9rem}
.prog-bar{height:3px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .25s}
.reset-link{font-size:12px;color:var(--color-text-secondary);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:3px;-webkit-appearance:none;appearance:none;padding:2px;touch-action:manipulation}
.reset-link i{font-size:13px;pointer-events:none}
.reset-link:active{color:var(--color-text-primary)}

/* phases & steps */
.phase{margin-bottom:1.1rem}
.phase:last-child{margin-bottom:0}
.phase-stamp{display:inline-block;font-family:var(--slab);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1.5px dashed var(--accent-soft-strong);border-radius:999px;padding:3px 11px;margin-bottom:.55rem}
.phase:nth-child(odd) .phase-stamp{transform:rotate(-1deg)}
.phase:nth-child(even) .phase-stamp{transform:rotate(1deg)}
.step-row{display:flex;gap:11px}
.step-left{display:flex;flex-direction:column;align-items:center;width:38px;flex-shrink:0}
.step-dot{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--color-border-secondary);background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none;padding:0;touch-action:manipulation;color:var(--color-text-secondary);transition:background .15s,border-color .15s,color .15s,transform .12s}
.step-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.step-dot:active{transform:scale(.92)}
.step-dot i{font-size:16px;pointer-events:none}
.step-line{flex:1;width:1.5px;background:var(--color-border-tertiary);min-height:8px;margin-top:2px}
.step-row:last-child .step-line{display:none}
.step-content{flex:1;padding-bottom:1.1rem;min-width:0}
.step-title{font-size:15px;font-weight:600;color:var(--color-text-primary);line-height:1.3;margin-bottom:4px}
.step-title.done{color:var(--color-text-secondary);text-decoration:line-through}
.step-body{font-size:13px;color:var(--color-text-secondary);line-height:1.65}
.step-body ul{padding-left:16px;margin-top:3px}
.step-body li{margin-bottom:1px}

/* notes */
.notes-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.notes-item{font-size:13px;color:var(--color-text-secondary);line-height:1.65;padding-left:16px;position:relative}
.notes-item::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.notes-sub{margin-top:6px;padding-left:4px;list-style:none;counter-reset:nsub;display:flex;flex-direction:column;gap:3px}
.notes-sub li{font-size:12.5px;color:var(--color-text-secondary);line-height:1.6;padding-left:20px;position:relative;counter-increment:nsub}
.notes-sub li::before{content:counter(nsub) '.';position:absolute;left:0;color:var(--accent);font-weight:600;font-family:var(--slab);font-size:12px}
.notes-after{font-size:12px;color:var(--color-text-secondary);margin-top:6px;padding-left:2px;font-style:italic}

@media(prefers-reduced-motion:reduce){
  .tab-btn,.seg-btn,.step-dot,.prog-fill{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
<h2 class="sr-only">Sourdough bake planner — pick a recipe, scale ingredients, and check off each step</h2>
<div class="pg">

  <div class="hero">
    <div class="hero-mark"><i class="ti ti-bread" aria-hidden="true"></i></div>
    <div>
      <div class="hero-title">Sourdough Planner</div>
      <div class="hero-sub">Mix, fold, proof, bake.</div>
    </div>
  </div>

  <div class="tab-scroll">
    <div class="tab-track" id="tabRow">
      <button class="tab-btn active" data-r="plain"      onclick="setRecipe('plain')"      type="button">🍞 Classic</button>
      <button class="tab-btn"        data-r="pumpkin"    onclick="setRecipe('pumpkin')"    type="button">🎃 Pumpkin Spice</button>
      <button class="tab-btn"        data-r="chocolate"  onclick="setRecipe('chocolate')"  type="button">🍫 Chocolate</button>
      <button class="tab-btn"        data-r="cheddar"    onclick="setRecipe('cheddar')"    type="button">🌶️ Cheddar Jalapeño</button>
      <button class="tab-btn"        data-r="cheezits"   onclick="setRecipe('cheezits')"   type="button">🟧 Cheez-Its</button>
    </div>
  </div>

  <div class="card">
    <span class="sec-label">Equipment</span>
    <div class="equip-grid" id="equipGrid"></div>
  </div>

  <div class="card" id="controls">
    <div class="control-group">
      <span class="control-label">Batch size</span>
      <div class="seg-row" style="--cols:3" id="multRow">
        <button class="seg-btn" data-m="0.5" onclick="setMult(0.5)" type="button" aria-pressed="false">0.5×</button>
        <button class="seg-btn active" data-m="1" onclick="setMult(1)" type="button" aria-pressed="true">1×</button>
        <button class="seg-btn" data-m="2" onclick="setMult(2)" type="button" aria-pressed="false">2×</button>
      </div>
    </div>
    <div class="control-group">
      <span class="control-label">Proof method</span>
      <div class="seg-row" style="--cols:2" id="proofRow">
        <button class="seg-btn active" data-p="cold" onclick="setProof('cold')" type="button" aria-pressed="true"><i class="ti ti-snowflake" aria-hidden="true"></i>Cold</button>
        <button class="seg-btn"        data-p="warm" onclick="setProof('warm')" type="button" aria-pressed="false"><i class="ti ti-sun"       aria-hidden="true"></i>Warm</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec-row">
      <span class="sec-label">Ingredients</span>
      <span class="mult-badge" id="multBadge">1×</span>
    </div>
    <div class="ingr-grid" id="ig"></div>
  </div>

  <div class="card">
    <div class="prog-wrap">
      <div class="sec-row">
        <span class="sec-label" style="margin:0">Steps</span>
        <button class="reset-link" onclick="resetSteps()" type="button"><i class="ti ti-refresh" aria-hidden="true"></i>Reset</button>
      </div>
      <span id="pl" style="font-size:12px;color:var(--color-text-secondary)"></span>
      <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    </div>
    <div id="tl"></div>
  </div>

</div>
</div>
<script>
let mult = 1, proof = 'cold', doneState = {}, recipe = 'plain';

function fmtAmt(n){
  const v = Math.round(n * 10) / 10;
  return (v % 1 === 0) ? String(v) : v.toFixed(1);
}
// shorthand: grams with current multiplier
function g(n){ return fmtAmt(n * mult) + 'g'; }

const RECIPE_NOTES = {
  pumpkin:`<ul class="notes-list">
    <li class="notes-item">Need twine to wrap around the loaf — can do this right before baking</li>
    <li class="notes-item">Soak twine in olive oil to prevent sticking</li>
    <li class="notes-item">Use a stick of cinnamon to look like a stem</li>
    <li class="notes-item">Use lamination technique for spreading, but leave the edges undone — otherwise it may not stick well for shaping</li>
  </ul>`,
  chocolate:`<ul class="notes-list">
    <li class="notes-item">The more chips the better — it won't taste very chocolatey without them</li>
    <li class="notes-item">Experiment with various amounts of espresso when blooming</li>
    <li class="notes-item">Alternative mix order to consider:
      <ol class="notes-sub">
        <li>Mix cocoa powder, espresso, water</li>
        <li>Add starter and brown sugar</li>
        <li>Mix until sugar is dissolved</li>
        <li>Add bread flour, salt, and vanilla extract</li>
        <li>Wait 1 hour for autolyse</li>
      </ol>
      <div class="notes-after">Then continue with the classic recipe from there.</div>
    </li>
  </ul>`,
  cheddar:`<ul class="notes-list">
    <li class="notes-item">Bigger chunks of cheese taste better but make it harder to shape — it's a tradeoff. Lamination technique works well for incorporating.</li>
    <li class="notes-item">The ½ jalapeño is for cross sections to lay on top of the loaf. Can bake directly on top.</li>
  </ul>`,
};

// ── Equipment ────────────────────────────────────────────
function getEquipment(r){
  if(r === 'cheezits') return [
    {l:'Large bowl'}, {l:'Hand mixer'},
    {l:'Parchment paper (×2)'}, {l:'Rolling pin'},
    {l:'Pasta cutter wheel'}, {l:'Chopstick'},
    {l:'Baking sheet'}, {l:'Measuring cups'},
  ];
  return [
    {l:'Large bowl with lid'}, {l:'Bread sling or parchment'},
    {l:'Digital scale'}, {l:'Large cutting board'},
    {l:'Banneton'}, {l:'Rice flour'},
    {l:'Dough scraper', opt:true}, {l:'Pizza stone', opt:true},
    {l:'Dutch oven or cast iron'}, {l:'Lame or sharp knife'},
  ];
}

// ── Ingredients ──────────────────────────────────────────
function getIngredients(r){
  const f = (n, u) => fmtAmt(n * mult) + u;
  if(r === 'plain') return [
    {a:f(465,'g'), l:'Bread flour'},   {a:f(50,'g'),  l:'Whole wheat'},
    {a:f(330,'g'), l:'Water'},         {a:f(125,'g'), l:'Starter'},
    {a:f(12,'g'),  l:'Salt'},
  ];
  if(r === 'pumpkin') return [
    {a:f(500,'g'), l:'Bread flour'},   {a:f(240,'g'), l:'Water'},
    {a:f(200,'g'), l:'Pumpkin purée'}, {a:f(100,'g'), l:'Starter'},
    {a:f(25,'g'),  l:'Maple syrup'},   {a:f(12,'g'),  l:'Salt'},
    {a:f(50,'g'),  l:'Sugar (coat)'},  {a:f(5,'g'),   l:'Cinnamon (coat)'},
    {a:f(5,'g'),   l:'Pumpkin spice (coat)'},
  ];
  if(r === 'chocolate') return [
    {a:f(500,'g'), l:'Bread flour'},   {a:f(275,'g'), l:'Water'},
    {a:f(150,'g'), l:'Starter'},       {a:f(50,'g'),  l:'Cocoa powder'},
    {a:f(50,'g'),  l:'Brown sugar'},   {a:f(10,'g'),  l:'Salt'},
    {a:fmtAmt(mult)+' tbsp', l:'Vanilla extract'}, {a:'— taste', l:'Choc. chips'},
  ];
  if(r === 'cheddar') return [
    {a:f(465,'g'), l:'Bread flour'},   {a:f(50,'g'),  l:'Whole wheat'},
    {a:f(330,'g'), l:'Water'},         {a:f(125,'g'), l:'Starter'},
    {a:f(12,'g'),  l:'Salt'},          {a:'2 cups',   l:'Mild cheddar'},
    {a:'1.5 + ½',  l:'Jalapeños'},
  ];
  if(r === 'cheezits') return [
    {a:'2 cups',   l:'Sharp cheddar'}, {a:'4 tbsp',   l:'Unsalted butter'},
    {a:'1 cup',    l:'AP flour'},      {a:'4 tbsp',   l:'Sourdough discard'},
    {a:'1 tsp',    l:'Salt'},          {a:'¼ tsp',    l:'Garlic powder'},
    {a:'1 tsp',    l:'Cold water'},    {a:'to top',   l:'Sea salt'},
  ];
}

// ── Steps / Phases ────────────────────────────────────────
function getPhases(r){
  const proofStep = proof === 'cold'
    ? {id:'proof', icon:'ti-snowflake', title:'Cold proof',
       body:'Into the fridge for <b>16–24 hours</b> — 24 is ideal. Longer means more sour.'}
    : {id:'proof', icon:'ti-sun', title:'Warm proof',
       body:'Leave at room temp, watched not timed:<ul><li>75–80°F → 1–1.5 hr</li><li>70–74°F → 1.5–2.5 hr</li><li>Below 70°F → 2–3 hr</li></ul>Dough should look slightly puffy, not doubled.'};

  const bulkRest = {id:'bulk-rest', icon:'ti-clock', title:'Let it rise',
    body:'Cover, leave untouched <b>3–4 additional hours</b>. Ignore the clock, watch the dough:<ul><li>Risen 50–75%</li><li>Slightly domed top</li><li>Bubbles on the sides</li><li>Jiggles like jello when you shake the bowl</li></ul>Still tight → wait longer. Loose and collapsing → went too long. Very loose + bubbly → that\'s focaccia now, not sourdough.'};

  const stdFolds = [
    {id:'sf1',   icon:'ti-arrows-up-down', title:'Stretch & fold 1',
     body:'Move dough to a lightly floured cutting board and wet your hands. Picture the dough as a square: stretch each side up as far as you can without tearing and fold to the middle, then do the same for each corner — 8 folds total. Cover, rest 30 min.'},
    {id:'sf2',   icon:'ti-arrows-up-down', title:'Stretch & fold 2',
     body:'Repeat the same 8 folds. Cover, rest 30 min.'},
    {id:'coil1', icon:'ti-rotate',         title:'Coil fold 1',
     body:'Gently lift the dough from the middle, let the sagging ends fold under themselves. Rotate the bowl, repeat 4 times. Cover, rest 30 min.'},
    {id:'coil2', icon:'ti-rotate',         title:'Coil fold 2',
     body:'Repeat the coil fold. Gently shape into a loose ball. Cover, rest 30 min.'},
  ];

  const bakeSteps = [
    {id:'preheat', icon:'ti-flame', title:'Preheat',
     body:'Dutch oven inside — set a pizza stone underneath if you have one to prevent bottom burns. Oven to <b>500°F</b>, 20–30 min.'},
    {id:'bake',    icon:'ti-knife', title:'Score & bake',
     body:'Take dough from fridge. Flip onto a lightly rice-floured bread sling. Score with a lame, lower into the Dutch oven.<ul><li>475°F, lid ON — 30 min</li><li>450°F, lid OFF — 10–15 min</li></ul>'},
    {id:'cool',    icon:'ti-clock', title:'Cool',
     body:'Rest on a rack at least <b>2 hours</b>, ideally 3. Cut early and the crumb goes gummy.'},
  ];

  // ── CLASSIC ──────────────────────────────────────────────
  if(r === 'plain') return [
    {phase:'Starter', steps:[
      {id:'feed', icon:'ti-droplet', title:'Feed your starter',
       body:`Night before, ~10 PM. Feed <b>1:4:4</b> (starter:flour:water) to have ${g(125)} ready around 8–9 AM — falling from its peak, not still rising.`},
    ]},
    {phase:'Mix & autolyse', steps:[
      {id:'autolyse',    icon:'ti-droplets', title:'Autolyse',
       body:`In a large bowl, combine ${g(465)} bread flour + ${g(50)} whole wheat and mix by hand. Get your hands wet to prevent sticking, add ${g(300)} room-temp water (~76°F), saving ${g(30)} for later. Mix until no dry flour remains — it'll look shaggy and cling to your hands. Cover, rest 1 hour.`},
      {id:'add-starter', icon:'ti-plus',     title:'Add starter',
       body:`Add ${g(125)} starter. Slap-and-fold 2 min until combined. Cover, rest 20 min.`},
      {id:'add-salt',    icon:'ti-dots',     title:'Add salt',
       body:`Poke the dough with 10 fingers, 3 times. Combine ${g(12)} salt with the ${g(30)} water saved earlier, mix in. Slap-and-fold 2 min. Cover, rest 15 min.`},
    ]},
    {phase:'Bulk — folds', steps: stdFolds},
    {phase:'Bulk — rest',  steps: [bulkRest]},
    {phase:'Shape', steps:[
      {id:'preshape', icon:'ti-shape',  title:'Pre-shape',
       body:'Lightly flour the cutting board with rice flour and gently turn the dough out. Letter-fold (top to middle, bottom to middle), then roll into a ball with tension. Gentle, not loose — too loose and the gas escapes.'},
      {id:'banneton', icon:'ti-basket', title:'Into the banneton',
       body:'Place dough <b>seam-side up</b> in a rice-floured banneton. Very lightly dust the top with rice flour so it won\'t stick to the cover. Cover with a towel, bag, or loose plastic wrap.'},
    ]},
    {phase:'Proof', steps:[proofStep]},
    {phase:'Bake',  steps: bakeSteps},
  ];

  // ── PUMPKIN SPICE ────────────────────────────────────────
  if(r === 'pumpkin') return [
    {phase:'Starter', steps:[
      {id:'feed', icon:'ti-droplet', title:'Feed your starter',
       body:`Night before, ~10 PM. Feed <b>1:4:4</b> (starter:flour:water) to have ${g(100)} ready around 8–9 AM — falling from its peak, not still rising.`},
    ]},
    {phase:'Mix & autolyse', steps:[
      {id:'wet-prep',    icon:'ti-droplets', title:'Prep wet ingredients',
       body:`Whisk together ${g(200)} pumpkin purée, ${g(240)} room-temp water, and ${g(25)} maple syrup until smooth.`},
      {id:'autolyse',    icon:'ti-dots',     title:'Autolyse',
       body:`In a large bowl, combine ${g(500)} bread flour. Add the pumpkin mixture and mix until no dry flour remains — it'll be denser than classic dough. Cover, rest 1 hour.`},
      {id:'add-starter', icon:'ti-plus',     title:'Add starter',
       body:`Add ${g(100)} starter. Slap-and-fold 2 min until combined. Cover, rest 20 min.`},
      {id:'add-salt',    icon:'ti-dots',     title:'Add salt',
       body:`Poke the dough with 10 fingers, 3 times. Add ${g(12)} salt directly, slap-and-fold 2 min to incorporate. Cover, rest 15 min.`},
    ]},
    {phase:'Bulk — folds', steps: stdFolds},
    {phase:'Bulk — rest',  steps: [bulkRest]},
    {phase:'Shape', steps:[
      {id:'preshape',   icon:'ti-shape',    title:'Pre-shape',
       body:'Gently turn the dough out onto a lightly rice-floured surface. Letter-fold, then roll into a tight ball with tension.'},
      {id:'spice-coat', icon:'ti-sparkles', title:'Spice coating',
       body:`Mix ${g(50)} sugar, ${g(5)} cinnamon, and ${g(5)} pumpkin spice in a shallow dish. Roll the outside of the shaped loaf in the coating before placing it in the banneton.`},
      {id:'banneton',   icon:'ti-basket',   title:'Into the banneton',
       body:'Place dough <b>seam-side up</b> in a rice-floured banneton. Lightly dust the top with rice flour. Cover and proof.'},
    ]},
    {phase:'Proof', steps:[proofStep]},
    {phase:'Bake',  steps: bakeSteps},
  ];

  // ── CHOCOLATE ────────────────────────────────────────────
  if(r === 'chocolate') return [
    {phase:'Starter', steps:[
      {id:'feed', icon:'ti-droplet', title:'Feed your starter',
       body:`Night before, ~10 PM. Feed <b>1:4:4</b> (starter:flour:water) to have ${g(150)} ready around 8–9 AM — falling from its peak, not still rising.`},
    ]},
    {phase:'Mix & autolyse', steps:[
      {id:'bloom',       icon:'ti-coffee',   title:'Bloom the cocoa',
       body:`Add ${g(50)} cocoa powder to a small bowl. Pour 1 shot of espresso + enough hot water to reach ${g(100)} liquid total. Stir smooth. Let it cool to room temp — do this before starting the autolyse.`},
      {id:'autolyse',    icon:'ti-droplets', title:'Autolyse',
       body:`In a large bowl, combine ${g(500)} bread flour. Add ${g(275)} room-temp water, ${g(50)} brown sugar, ${fmtAmt(mult)} tbsp vanilla extract, and the cooled cocoa bloom. Mix until no dry flour remains. Cover, rest 1 hour.`},
      {id:'add-starter', icon:'ti-plus',     title:'Add starter',
       body:`Add ${g(150)} starter. Slap-and-fold 2 min until combined. Cover, rest 20 min.`},
      {id:'add-salt',    icon:'ti-dots',     title:'Add salt',
       body:`Poke the dough with 10 fingers, 3 times. Add ${g(10)} salt, slap-and-fold 2 min to incorporate. Cover, rest 15 min.`},
    ]},
    {phase:'Bulk — folds', steps: stdFolds},
    {phase:'Bulk — rest',  steps: [bulkRest]},
    {phase:'Shape', steps:[
      {id:'preshape', icon:'ti-shape',  title:'Pre-shape + chips',
       body:'Gently turn the dough out onto a lightly floured surface. Scatter chocolate chips over the surface, then letter-fold to trap them inside, and roll into a tight ball. The chips will poke out a bit — that\'s fine.'},
      {id:'banneton', icon:'ti-basket', title:'Into the banneton',
       body:'Place dough <b>seam-side up</b> in a rice-floured banneton. Lightly dust the top. Cover and proof.'},
    ]},
    {phase:'Proof', steps:[proofStep]},
    {phase:'Bake',  steps: bakeSteps},
  ];

  // ── CHEDDAR JALAPEÑO ─────────────────────────────────────
  if(r === 'cheddar') return [
    {phase:'Starter', steps:[
      {id:'feed', icon:'ti-droplet', title:'Feed your starter',
       body:`Night before, ~10 PM. Feed <b>1:4:4</b> (starter:flour:water) to have ${g(125)} ready around 8–9 AM — falling from its peak.`},
    ]},
    {phase:'Mix & autolyse', steps:[
      {id:'autolyse',    icon:'ti-droplets', title:'Autolyse',
       body:`In a large bowl, combine ${g(465)} bread flour + ${g(50)} whole wheat. Wet your hands, add ${g(300)} room-temp water (~76°F), saving ${g(30)} for later. Mix until no dry flour remains. Cover, rest 1 hour.`},
      {id:'add-starter', icon:'ti-plus',     title:'Add starter',
       body:`Add ${g(125)} starter. Slap-and-fold 2 min until combined. Cover, rest 20 min.`},
      {id:'add-salt',    icon:'ti-dots',     title:'Add salt',
       body:`Poke with 10 fingers, 3 times. Combine ${g(12)} salt with the ${g(30)} water saved earlier, mix in. Slap-and-fold 2 min. Cover, rest 15 min.`},
    ]},
    {phase:'Bulk — folds', steps:[
      {id:'sf1',    icon:'ti-arrows-up-down', title:'Stretch & fold 1',
       body:'Move dough to a lightly floured cutting board and wet your hands. Stretch each side up without tearing and fold to the middle, then do the same for each corner — 8 folds total. Cover, rest 30 min.'},
      {id:'addins', icon:'ti-plus',           title:'Fold in add-ins',
       body:'Spread the dough flat on the board. Layer 2 cups cubed mild cheddar and 1.5 diced jalapeños over the surface. Letter-fold to encase them, then do a gentle coil fold to distribute evenly. Cover, rest 30 min.'},
      {id:'sf2',    icon:'ti-arrows-up-down', title:'Stretch & fold 2',
       body:'Gently repeat the 8-fold stretch — go easy around the cheese chunks. Cover, rest 30 min.'},
      {id:'coil1',  icon:'ti-rotate',         title:'Coil fold 1',
       body:'Lift from the middle, let ends fold under. Rotate, repeat 4 times. Cover, rest 30 min.'},
      {id:'coil2',  icon:'ti-rotate',         title:'Coil fold 2',
       body:'Repeat the coil fold. Gently shape into a loose ball. Cover, rest 30 min.'},
    ]},
    {phase:'Bulk — rest', steps:[bulkRest]},
    {phase:'Shape', steps:[
      {id:'preshape', icon:'ti-shape',  title:'Pre-shape',
       body:'Gently turn the dough out. Letter-fold and roll into a tight ball — cheese bits poking through is totally normal.'},
      {id:'banneton', icon:'ti-basket', title:'Into the banneton',
       body:'Arrange the ½ jalapeño sliced into rounds on the bottom of a rice-floured banneton — they\'ll end up on top after the flip. Place dough <b>seam-side up</b> over them. Dust lightly with rice flour. Cover.'},
    ]},
    {phase:'Proof', steps:[proofStep]},
    {phase:'Bake',  steps: bakeSteps},
  ];

  // ── CHEEZ-ITS ────────────────────────────────────────────
  if(r === 'cheezits') return [
    {phase:'Mix', steps:[
      {id:'cz-cream',   icon:'ti-star',        title:'Cream cheese & butter',
       body:'In a large bowl, combine 2 cups sharp cheddar (shredded), 4 tbsp room-temp butter, 1 tsp salt, and ¼ tsp garlic powder. Hand mixer on medium for <b>2 minutes</b> until fully combined and fluffy.'},
      {id:'cz-starter', icon:'ti-plus',        title:'Add sourdough discard',
       body:'Add 4 tbsp sourdough discard to the cheese mixture. Mix on high until fully combined.'},
      {id:'cz-flour',   icon:'ti-dots',        title:'Add flour',
       body:'Add 1 cup all-purpose flour. Mix until fully combined, about 1 minute.'},
      {id:'cz-water',   icon:'ti-droplet',     title:'Add water & test',
       body:'Add 1 tsp cold water, mix a few seconds. Press dough between two fingers — it should hold its shape.'},
    ]},
    {phase:'Chill & shape', steps:[
      {id:'cz-chill',   icon:'ti-snowflake',   title:'Refrigerate',
       body:'Press dough into a ball and wrap in plastic wrap. Chill in the fridge for <b>30 minutes</b>.'},
      {id:'cz-roll',    icon:'ti-layout-grid', title:'Roll & cut',
       body:'Roll dough between two sheets of parchment until <b>⅛" thick</b>. Use a pasta cutter wheel to cut into squares. Poke a hole in the center of each cracker with a chopstick.'},
      {id:'cz-season',  icon:'ti-sparkles',    title:'Season & transfer',
       body:'Sprinkle tops with sea salt. Transfer crackers to a parchment-lined baking sheet.'},
    ]},
    {phase:'Bake', steps:[
      {id:'cz-bake',    icon:'ti-flame',       title:'Bake',
       body:'Bake at <b>350°F</b> for 15–18 minutes until golden brown around the edges. Let cool on the sheet — they crisp up as they cool.'},
    ]},
  ];
}

// ── State setters ─────────────────────────────────────────
function setRecipe(r){
  recipe = r; doneState = {};
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.r===r));
  const scalable = r !== 'cheezits';
  document.getElementById('controls').style.display = scalable ? '' : 'none';
  document.getElementById('multBadge').style.display = scalable ? '' : 'none';
  renderEquipment(); renderIngredients(); renderSteps();
}

function setMult(m){
  mult = m;
  document.querySelectorAll('#multRow .seg-btn').forEach(b=>{
    const on = parseFloat(b.dataset.m)===m;
    b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
  });
  document.getElementById('multBadge').textContent = m + '×';
  renderIngredients(); renderSteps();
}

function setProof(p){
  proof = p;
  document.querySelectorAll('#proofRow .seg-btn').forEach(b=>{
    const on = b.dataset.p===p;
    b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
  });
  renderSteps();
}

// ── Renderers ─────────────────────────────────────────────
function renderEquipment(){
  document.getElementById('equipGrid').innerHTML = getEquipment(recipe).map(i=>
    `<div class="equip-item">${i.l}${i.opt?'<span class="equip-opt">optional</span>':''}</div>`
  ).join('');
}

function renderIngredients(){
  document.getElementById('ig').innerHTML = getIngredients(recipe).map(({a,l})=>
    `<div class="ingr-card"><div class="ingr-amt">${a}</div><div class="ingr-lbl">${l}</div></div>`
  ).join('');
}

function renderSteps(){
  const notes = RECIPE_NOTES[recipe];
  const progWrap = document.querySelector('.prog-wrap');
  if(notes){
    progWrap.style.display = 'none';
    document.getElementById('tl').innerHTML = notes;
    return;
  }
  progWrap.style.display = '';
  document.getElementById('tl').innerHTML = getPhases(recipe).map(ph=>`
    <div class="phase">
      <span class="phase-stamp">${ph.phase}</span>
      ${ph.steps.map((s,i)=>{
        const done = !!doneState[s.id];
        return `<div class="step-row">
          <div class="step-left">
            <button class="step-dot${done?' done':''}" onclick="toggleStep('${s.id}')" type="button" aria-pressed="${done}" aria-label="${s.title}, mark ${done?'incomplete':'complete'}">
              ${done?'<i class="ti ti-check" aria-hidden="true"></i>':`<i class="ti ${s.icon}" aria-hidden="true"></i>`}
            </button>
            ${i<ph.steps.length-1?'<div class="step-line"></div>':''}
          </div>
          <div class="step-content">
            <div class="step-title${done?' done':''}">${s.title}</div>
            <div class="step-body">${s.body}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`
  ).join('');
  updProg();
}

function toggleStep(id){ doneState[id]=!doneState[id]; renderSteps(); }
function resetSteps(){ doneState={}; renderSteps(); }

function updProg(){
  if(RECIPE_NOTES[recipe]) return;
  const ids = getPhases(recipe).flatMap(ph=>ph.steps.map(s=>s.id));
  const n = ids.filter(id=>doneState[id]).length, t = ids.length;
  document.getElementById('pf').style.width = Math.round(n/t*100)+'%';
  document.getElementById('pl').textContent = n+' of '+t+' steps done';
}

// ── Init ──────────────────────────────────────────────────
renderEquipment(); renderIngredients(); renderSteps();
</script>
</body>
</html>
