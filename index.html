
<style>
*{box-sizing:border-box;margin:0;padding:0}
.pg{padding:1rem 0 2rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem;margin-bottom:.75rem}
.sec-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--color-text-secondary)}
.stepper{display:flex;align-items:center;gap:0;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;height:36px}
.step-btn{width:44px;height:36px;border:none;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-btn:active{background:var(--color-border-tertiary)}
.step-val{flex:1;text-align:center;font-size:15px;font-weight:500;color:var(--color-text-primary)}
.proof-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.proof-btn{padding:9px 0;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:14px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);text-align:center;transition:all .15s}
.proof-btn.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.go-btn{width:100%;padding:13px;border-radius:var(--border-radius-md);border:none;background:var(--color-text-primary);color:var(--color-background-primary);font-size:15px;font-weight:500;cursor:pointer;margin-top:10px}
.go-btn:active{opacity:.8}
.ingr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ingr-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem}
.ingr-amt{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.ingr-lbl{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.prog-wrap{margin-bottom:1rem}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-bar{height:3px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--color-text-primary);border-radius:2px;transition:width .3s}
.tl-item{display:flex;gap:12px;position:relative}
.tl-left{display:flex;flex-direction:column;align-items:center;width:40px;flex-shrink:0}
.tl-dot{width:40px;height:40px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tl-dot:active{transform:scale(.92)}
.tl-dot.done{background:var(--color-text-primary);border-color:var(--color-text-primary)}
.tl-dot i{font-size:17px;color:var(--color-text-secondary)}
.tl-dot.done i{color:var(--color-background-primary)}
.tl-line{flex:1;width:1.5px;background:var(--color-border-tertiary);min-height:10px}
.tl-content{flex:1;padding-bottom:1.25rem;min-width:0}
.tl-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:8px}
.tl-name{font-size:15px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
.tl-name.done{text-decoration:line-through;color:var(--color-text-secondary)}
.tl-time{font-size:13px;color:var(--color-text-secondary);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.tl-time.now{color:var(--color-text-primary);font-weight:500}
.tl-body{font-size:13px;color:var(--color-text-secondary);line-height:1.65}
.tl-body ul{padding-left:16px;margin-top:3px}
.tl-body li{margin-bottom:1px}
.tl-item:last-child .tl-line{display:none}
.now-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--color-text-warning);margin-right:5px;vertical-align:2px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--color-text-secondary);font-size:14px;line-height:1.6}
.empty i{font-size:36px;display:block;margin-bottom:.6rem;color:var(--color-border-secondary)}
</style>

<h2 class="sr-only">Sourdough bake planner — configure loaves, start time, and proof type to generate a tappable step-by-step timeline</h2>

<div class="pg">

<div class="card">
  <div class="sec-label">Setup</div>
  <div class="field-row">
    <div class="field">
      <label>Loaves</label>
      <div class="stepper">
        <div class="step-btn" onclick="adj(-1)" role="button" aria-label="remove loaf"><i class="ti ti-minus" style="font-size:15px"></i></div>
        <span class="step-val" id="lv">1</span>
        <div class="step-btn" onclick="adj(1)" role="button" aria-label="add loaf"><i class="ti ti-plus" style="font-size:15px"></i></div>
      </div>
    </div>
    <div class="field">
      <label>Start time</label>
      <input type="time" id="st" value="08:00" style="height:36px;width:100%">
    </div>
  </div>
  <div class="field" style="margin-bottom:0">
    <label>Proof type</label>
    <div class="proof-row" style="margin-top:5px">
      <div class="proof-btn active" id="pc" onclick="sp('cold')"><i class="ti ti-snowflake" aria-hidden="true"></i> Cold</div>
      <div class="proof-btn" id="pw" onclick="sp('warm')"><i class="ti ti-sun" aria-hidden="true"></i> Warm</div>
    </div>
  </div>
  <button class="go-btn" onclick="go()">Plan my bake</button>
</div>

<div id="out" style="display:none">

<div class="card">
  <div class="sec-label">Ingredients</div>
  <div class="ingr-grid" id="ig"></div>
</div>

<div class="card">
  <div class="prog-wrap">
    <div class="prog-row">
      <span class="sec-label" style="margin:0">Timeline</span>
      <span id="pl" style="font-size:12px;color:var(--color-text-secondary)"></span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  </div>
  <div id="tl"></div>
</div>

</div>

<div id="empty" class="empty">
  <i class="ti ti-bread" aria-hidden="true"></i>
  Configure your bake above,<br>then tap "Plan my bake"
</div>

</div>

<script>
let loaves=1, proof='cold', times=[], done=[];

const B={starter:125,water:330,salt:12,bread:465,wheat:50};

function adj(d){loaves=Math.max(1,Math.min(8,loaves+d));document.getElementById('lv').textContent=loaves}
function sp(t){proof=t;document.getElementById('pc').classList.toggle('active',t==='cold');document.getElementById('pw').classList.toggle('active',t==='warm')}

function steps(p){
  const s=[
    {n:'Feed starter',ic:'ti-droplet',off:-600,b:'<b>Night before (~10 PM)</b> — feed 1:4:4 (starter:flour:water). Peaks ~8–9 AM.'},
    {n:'Autolyse',ic:'ti-droplets',off:0,b:'Mix all flour. Add 95% of water, mix until no dry flour. Rest 1 hour — gluten develops on its own.'},
    {n:'Add starter',ic:'ti-plus',off:60,b:'Add starter and slap-and-fold 2 min until fully combined. Rest 20 min.'},
    {n:'Add salt',ic:'ti-dots',off:80,b:'Dissolve salt in remaining water. Incorporate with slap-and-fold. Rest 15 min.'},
    {n:'Stretch & fold 1',ic:'ti-arrows-up-down',off:95,b:'Wet hand, stretch up and fold over, rotating 90° each time. 4–6 folds. Rest 30 min.'},
    {n:'Stretch & fold 2',ic:'ti-arrows-up-down',off:125,b:'Repeat. Dough should feel noticeably stronger. Rest 30 min.'},
    {n:'Coil fold 1',ic:'ti-rotate',off:155,b:'Lift dough from center, let ends fold under. Rotate and repeat. Rest 30 min.'},
    {n:'Coil fold 2',ic:'ti-rotate',off:185,b:'Repeat coil fold, gently shape into ball. Rest 30 min.'},
    {n:'Bulk fermentation',ic:'ti-clock',off:215,b:'Rest 3–4 hours. Look for:<ul><li>50–75% volume rise</li><li>Bubbles on surface and sides</li><li>Dough jiggles like jello</li></ul>Trust your dough over the clock.'},
    {n:'Pre-shape',ic:'ti-shape',off:395,b:'Turn onto bare surface. Letter-fold then roll into a tight ball. Rest uncovered 20–30 min.'},
    {n:'Final shape & banneton',ic:'ti-basket',off:415,b:'Shape with surface tension. Place <b>seam-side up</b> in rice-floured banneton. Cover tightly.'},
  ];
  if(p==='cold'){
    s.push(
      {n:'Cold proof',ic:'ti-snowflake',off:425,b:'Into the fridge. Proof 8–24 hrs — longer = more sour, more open crumb.'},
      {n:'Score & bake',ic:'ti-knife',off:900,b:'Preheat dutch oven <b>500°F / 260°C for 45–60 min</b>. Score cold dough, lower in on parchment.<ul><li>Lid on → 475°F / 245°C — 30 min</li><li>Lid off → 450°F / 230°C — 10–15 min</li></ul>Cool on rack <b>2 hrs minimum</b> before slicing.'}
    );
  } else {
    s.push(
      {n:'Warm proof',ic:'ti-temperature',off:425,b:'Proof in banneton at room temp:<ul><li>75–80°F → 1–1.5 hrs</li><li>70–74°F → 1.5–2.5 hrs</li><li>Below 70°F → 2–3 hrs</li></ul>Poke test: dent springs back slowly.'},
      {n:'Score & bake',ic:'ti-knife',off:560,b:'Preheat dutch oven <b>500°F / 260°C for 45–60 min</b>. Score, lower in on parchment.<ul><li>Lid on → 475°F / 245°C — 30 min</li><li>Lid off → 450°F / 230°C — 10–15 min</li></ul>Cool on rack <b>2 hrs minimum</b> before slicing.'}
    );
  }
  return s;
}

function fmt(d){return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}

function go(){
  const [h,m]=document.getElementById('st').value.split(':');
  const base=new Date();base.setHours(+h,+m,0,0);
  const ss=steps(proof);
  times=ss.map(s=>new Date(base.getTime()+s.off*60000));
  done=ss.map(()=>false);
  document.getElementById('empty').style.display='none';
  document.getElementById('out').style.display='block';
  renderIngr();
  renderTl(ss);
  updProg();
}

function renderIngr(){
  const items=[['Bread flour',B.bread*loaves+'g'],['Whole wheat',B.wheat*loaves+'g'],['Water',B.water*loaves+'g'],['Starter',B.starter*loaves+'g'],['Salt',B.salt*loaves+'g']];
  document.getElementById('ig').innerHTML=items.map(([l,v])=>`<div class="ingr-card"><div class="ingr-amt">${v}</div><div class="ingr-lbl">${l}</div></div>`).join('');
}

function renderTl(ss){
  const now=new Date();
  document.getElementById('tl').innerHTML=ss.map((s,i)=>{
    const isNow=!done[i]&&times[i]<=now&&(i===ss.length-1||!done[i+1]);
    return `<div class="tl-item" id="ti${i}">
      <div class="tl-left">
        <div class="tl-dot${done[i]?' done':''}" onclick="tog(${i})" role="button" aria-label="mark step ${done[i]?'incomplete':'complete'}">
          <i class="ti ${done[i]?'ti-check':s.ic}" aria-hidden="true"></i>
        </div>
        <div class="tl-line"></div>
      </div>
      <div class="tl-content">
        <div class="tl-head">
          <span class="tl-name${done[i]?' done':''}" id="tn${i}">${isNow?'<span class="now-dot"></span>':''}${s.n}</span>
          <span class="tl-time${isNow?' now':''}" id="tt${i}">${fmt(times[i])}</span>
        </div>
        <div class="tl-body">${s.b}</div>
      </div>
    </div>`;
  }).join('');
}

function tog(i){
  const ss=steps(proof);
  done[i]=!done[i];
  if(done[i]){
    const delta=new Date()-times[i];
    for(let j=i+1;j<times.length;j++){
      times[j]=new Date(times[j].getTime()+delta);
      const el=document.getElementById('tt'+j);
      if(el)el.textContent=fmt(times[j]);
    }
  }
  const dot=document.querySelector(`#ti${i} .tl-dot`);
  dot.querySelector('i').className='ti '+(done[i]?'ti-check':ss[i].ic);
  dot.classList.toggle('done',done[i]);
  document.getElementById('tn'+i).className='tl-name'+(done[i]?' done':'');
  updProg();
}

function updProg(){
  const n=done.filter(Boolean).length,t=done.length;
  document.getElementById('pf').style.width=Math.round(n/t*100)+'%';
  document.getElementById('pl').textContent=n+' of '+t+' steps done';
}
</script>
